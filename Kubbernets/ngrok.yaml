# ngrok.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: trackpak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      containers:
        - name: ngrok
          image: ngrok/ngrok
          args: ["http", "--domain=mongrel-active-completely.ngrok-free.app", "api-gateway:8080"]
          env:
            - name: NGROK_AUTHTOKEN
              value: "2tAWAZpvHz1ni52Zq2KseFVhT57_64vbC2rJv2VYAHoNg6Vnr"
          ports:
            - containerPort: 4040
---
apiVersion: v1
kind: Service
metadata:
  name: ngrok
  namespace: trackpak
spec:
  selector:
    app: ngrok
  ports:
    - port: 4040
      targetPort: 4040
  type: ClusterIP